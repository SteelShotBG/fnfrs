[workspace]
resolver = "2"
members = [
    "crates/fnfrs-core",
    "crates/fnfrs-app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
fnfrs-core = { path = "crates/fnfrs-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustc-hash = "2.1.3"
anyhow = "1.0.105"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
