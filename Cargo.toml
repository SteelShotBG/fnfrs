[workspace]
resolver = "2"
members = [
    "crates/fnfrs-core",
    "crates/fnfrs-audio",
    "crates/fnfrs-app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
fnfrs-core = { path = "crates/fnfrs-core" }
fnfrs-audio = { path = "crates/fnfrs-audio" }
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }
rubato = "5.1.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
anyhow = "1.0.105"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
