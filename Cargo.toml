[workspace]
resolver = "2"
members = [
    "crates/fnfrs-core",
    "crates/fnfrs-app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["fnfrs contributors"]

[workspace.dependencies]
fnfrs-core = { path = "crates/fnfrs-core" }
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "1.0.3"
cpal = "0.18.2"
symphonia = { version = "0.6.1", features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }
rubato = "5.1.0"
rtrb = "0.4.1"
glam = "0.34.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
anyhow = "1.0.105"
fontdue = "0.9.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
