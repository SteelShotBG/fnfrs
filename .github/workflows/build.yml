name: Build and Test (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin fnfrs-app

      - name: Check formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Package fnfrs.exe
        shell: pwsh
        run: Copy-Item -Path "target/release/fnfrs-app.exe" -Destination "fnfrs.exe"

      - name: Upload fnfrs.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnfrs-windows-x64
          path: fnfrs.exe
          if-no-files-found: error
